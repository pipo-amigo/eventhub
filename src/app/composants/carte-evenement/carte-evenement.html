<article class="carte" [class.termine]="termine()" [routerLink]="['/evenements', evenement().id]">
  <div class="haut">
    <app-badge-categorie [categorie]="evenement().categorie"></app-badge-categorie>
    @if (termine()) {
      <span class="mention-termine">Terminé</span>
    }
  </div>

  <h3>{{ evenement().titre }}</h3>
  <p class="club">{{ evenement().club }}</p>
  <p><strong>Date :</strong> {{ evenement().date | date: 'EEE d MMM y, HH:mm' }}</p>
  <p><strong>Lieu :</strong> {{ evenement().lieu }}</p>
  <p>{{ evenement().gratuit ? 'Gratuit' : 'Payant' }} - {{ restantes() | etatPlaces }}</p>

  <button class="favori" (click)="ajouterAuxFavoris($event)">Ajouter aux favoris</button>
</article>
