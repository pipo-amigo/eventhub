<article class="carte" [class.termine]="termine()" [routerLink]="['/evenements', evenement().id]">
  <app-badge-categorie [categorie]="evenement().categorie"></app-badge-categorie>
  @if (termine()) {
    <strong> (Terminé)</strong>
  }

  <h3>{{ evenement().titre }}</h3>
  <p>Club : {{ evenement().club }}</p>
  <p>Date : {{ evenement().date | date: 'EEE d MMM y, HH:mm' }}</p>
  <p>Lieu : {{ evenement().lieu }}</p>
  <p>{{ evenement().gratuit ? 'Gratuit' : 'Payant' }} - {{ restantes() | etatPlaces }}</p>

  <button (click)="ajouterAuxFavoris($event)">Ajouter aux favoris</button>
</article>
